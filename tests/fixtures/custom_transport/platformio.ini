[platformio]
default_envs = esp12e
[env]
framework = arduino
lib_ldf_mode = deep+
build_flags = -DAPLO_ENABLE_HTTPS=0 -DAPLO_TLS_ENABLE_BUNDLE=0
lib_deps = symlink://../../..
[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
[env:esp32-c3-devkitm-1]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
