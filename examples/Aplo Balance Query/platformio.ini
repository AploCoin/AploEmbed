[platformio]
src_dir = src
default_envs = esp32dev

[env]
framework = arduino
extra_scripts = pre:../../tools/trust/platformio.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    symlink://../..

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev

[env:esp32-c3-devkitm-1]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
